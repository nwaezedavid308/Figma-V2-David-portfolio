<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fetch property already configurable or non-redefinable
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('niux-theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}</script>
